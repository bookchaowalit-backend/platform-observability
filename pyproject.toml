[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-observability"
version = "0.1.0"
requires-python = ">=3.12"
description = "Bounded redacted service telemetry and authenticated metrics"
dependencies = ["prometheus-client>=0.20,<1", "opentelemetry-api>=1.20,<2", "opentelemetry-sdk>=1.20,<2", "opentelemetry-exporter-otlp-proto-http>=1.20,<2", "starlette>=0.46,<2"]

[project.optional-dependencies]
test = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "runtime_tests"]
