[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-observability"
version = "0.1.0"
requires-python = ">=3.12"
description = "Bounded redacted service telemetry and authenticated metrics"
dependencies = ["prometheus-client>=0.20,<1", "opentelemetry-api==1.45.1", "opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-common==1.45.1", "httpx>=0.27,<1", "starlette>=0.46,<2"]

[project.optional-dependencies]
test = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pytest>=8,<10"]
# Lint, type check and coverage tools for CI (uv sync --frozen --all-extras).
dev = ["mypy==2.4.0", "ruff==0.17.1", "pytest-cov==7.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "runtime_tests"]

[tool.coverage.run]
source = ["src/platform_observability", "scripts"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests", "runtime_tests"]
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# platform-api-gateway is checked out only in the CI contract job (PLATFORM_API_GATEWAY_SRC).
module = ["book_api_gateway.*"]
ignore_missing_imports = true
