apiVersion: v1
kind: ServiceAccount
metadata:
  name: shared-prometheus
  namespace: shared-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-prometheus-discovery
  namespace: shared-staging
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shared-prometheus-discovery
  namespace: shared-staging
subjects:
  - kind: ServiceAccount
    name: shared-prometheus
    namespace: shared-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shared-prometheus-discovery
