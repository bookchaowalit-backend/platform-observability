global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/shared-alerts.yaml
scrape_configs:
  - job_name: shared-infra
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/shared_metrics_token
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names: [shared-staging]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_part_of]
        regex: shared-infra
        action: keep
      - source_labels: [__meta_kubernetes_endpointslice_port_name]
        regex: http
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
