groups:
  - name: shared-infra
    rules:
      - alert: SharedServiceUnavailable
        expr: up{job="shared-infra"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Shared service scrape target is unavailable
      - alert: SharedServiceErrors
        expr: sum by (service) (rate(platform_requests_total{status=~"5.."}[5m])) / clamp_min(sum by (service) (rate(platform_requests_total[5m])), 0.01) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Shared service error ratio exceeds the staging threshold
      - alert: SharedServiceLatency
        expr: histogram_quantile(0.95, sum by (service, le) (rate(platform_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Shared service request latency exceeds the staging threshold
