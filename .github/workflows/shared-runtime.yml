name: Shared runtime
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reviewed shared core and service tests
        run: |
          python -m pip install -e '.[test]'
      - name: Test telemetry redaction and bounded export
        run: python -m pytest -q
      - name: Build service wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
