name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out platform-api-gateway (public, pinned) for BOO-160 gateway telemetry tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bookchaowalit-backend/platform-api-gateway
          ref: 6e1fb34489779582b55ad86f09940b46f3d7a17a
          path: .ci/platform-api-gateway
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify vendored schema matches pinned canonical
        run: python3 scripts/check_schema_pin.py

      - name: Run offline contract check and tests
        env:
          PLATFORM_API_GATEWAY_SRC: ${{ github.workspace }}/.ci/platform-api-gateway/src
          REQUIRE_GATEWAY_TESTS: "1"
        run: bash scripts/check.sh

  # Shared workflow: installs from uv.lock (uv sync --frozen --all-extras), runs Ruff and mypy
  # ([tool.mypy]), the offline contract check, the whole pytest suite (tests/ + runtime_tests/,
  # formerly shared-runtime.yml) under a coverage gate, and builds the wheel.
  offline:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12"
      format-check: false # follow-up: adopt ruff format
      # Ratchet: measured 90.21% on 2026-10-24 (ADR-0004: threshold = measured, rounded down).
      # The gateway parity tests run only in the contract job above, so they are not counted here.
      coverage-threshold: "90"
      test-command: |
        bash scripts/check.sh
        python -m pytest -q --cov --cov-report=
        uv build --wheel --out-dir dist .

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
