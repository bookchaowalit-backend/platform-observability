name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out platform-api-gateway (public, pinned) for BOO-160 gateway telemetry tests
        uses: actions/checkout@v4
        with:
          repository: bookchaowalit-backend/platform-api-gateway
          ref: 6e1fb34489779582b55ad86f09940b46f3d7a17a
          path: .ci/platform-api-gateway
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify vendored schema matches pinned canonical
        run: python3 scripts/check_schema_pin.py

      - name: Run offline contract check and tests
        env:
          PLATFORM_API_GATEWAY_SRC: ${{ github.workspace }}/.ci/platform-api-gateway/src
          REQUIRE_GATEWAY_TESTS: "1"
        run: bash scripts/check.sh

  offline:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12"
      install-command: "true" # standard library only: the step just creates the venv for this Python
      format-check: false # follow-up: adopt ruff format
      typecheck-command: "" # follow-up: add [tool.mypy]
      test-command: bash scripts/check.sh # offline: the contract job above adds the pinned upstream parity

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
